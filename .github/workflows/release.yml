name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI/harness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLI/harness/go.mod
          cache: true
          cache-dependency-path: CLI/harness/go.mod
      - name: Test
        run: go test ./...
      - name: Build release assets
        env:
          DIST_DIR: dist
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Verify release assets
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 7
          if find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) | grep -q .; then
            echo "release assets must be uncompressed binaries" >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
