name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLI/harness/go.mod
          cache: true
          cache-dependency-path: CLI/harness/go.mod
      - name: Check formatting
        run: test -z "$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/harness" .
