name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI/harn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLI/harn/go.mod
          cache: true
          cache-dependency-path: CLI/harn/go.mod
      - name: Check formatting
        run: test -z "$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Coverage
        run: |
          go test -covermode=atomic -coverprofile=cover.out ./...
          coverage="$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${coverage}%"
          awk -v value="$coverage" 'BEGIN { if (value + 0 < 70) { print "coverage below 70%"; exit 1 } }'
      - name: Static check
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Test installer without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/installer/... ./internal/state/...
      - name: Build
        run: go build -o "$RUNNER_TEMP/harn" .
      - name: Build release assets
        env:
          DIST_DIR: ${{ runner.temp }}/dist
        run: ./scripts/build-release.sh v0.0.0-ci

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate shared document contracts
        run: python3 -B Skills/swe/scripts/tests/test_standards.py
      - name: Validate module fixtures
        run: |
          for test in Skills/swe/*/scripts/tests/test_validate_documents.py; do
            python3 -B "$test"
          done
      - name: Lint Markdown
        run: python3 -B Skills/knowledge-doc-guard/scripts/knowledge_lint.py --all
      - name: Validate skill index
        run: python3 -B Skills/tests/test_index.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CLI/harn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLI/harn/go.mod
          cache: true
          cache-dependency-path: CLI/harn/go.mod
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Check release script syntax
        run: bash -n CLI/harn/scripts/build-release.sh
      - name: Test installer script
        run: bash scripts/test-install.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck install.sh CLI/harn/scripts/build-release.sh
