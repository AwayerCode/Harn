name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLI/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: CLI/harness/go.mod
          cache: true
          cache-dependency-path: CLI/harness/go.mod
      - name: Check formatting
        run: test -z "$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/harness" .
      - name: Build release assets
        env:
          DIST_DIR: ${{ runner.temp }}/dist
        run: ./scripts/build-release.sh v0.0.0-ci

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared document contracts
        run: python3 -B Skills/swe/scripts/tests/test_standards.py
      - name: Validate module fixtures
        run: |
          for test in Skills/swe/*/scripts/tests/test_validate_documents.py; do
            python3 -B "$test"
          done
      - name: Lint Markdown
        run: python3 -B Skills/knowledge-doc-guard/scripts/knowledge_lint.py --all
