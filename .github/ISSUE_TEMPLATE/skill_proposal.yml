name: Skill proposal
description: 提议新增或调整一个 Skill
title: "skill: "
labels: ["skill", "enhancement"]
body:
  - type: input
    id: name
    attributes:
      label: Skill 名称
      description: 全小写，使用连字符分隔，与目录名一致
      placeholder: example-skill
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 进入条件
      description: 什么任务、什么信号出现时应该使用它
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 职责边界
      description: 它负责什么，与已有 Skill 如何区分
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验收依据
      description: 如何判断 Skill 生效，包含哪些检查
    validations:
      required: true
