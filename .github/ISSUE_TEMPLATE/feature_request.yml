name: Feature request
description: 提议一个新的能力或改进
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的真实阻塞或重复成本
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明范围、替代方案和对现有项目的影响
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验收依据
      description: 说明如何判断改进确实有效
    validations:
      required: true
