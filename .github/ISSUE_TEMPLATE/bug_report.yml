name: Bug report
description: 报告可复现的 Harn 行为问题
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿在公开 Issue 中提交凭据、敏感数据或可直接利用的漏洞细节。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 输出来自 `harn version` 的版本号
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台
      description: 操作系统和 CPU 架构
      placeholder: macOS arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、可重复的命令和目录状态
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
